<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<style>
  :root {
    --amplify-red: #f8291f;
    --amplify-black: #0d0d0d;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background-color: var(--amplify-red);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: clamp(2.5rem, 8vh, 6rem);
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    width: min(90vw, 420px);
  }

  .logo svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .wordmark {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    letter-spacing: -0.01em;
    color: var(--amplify-black);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
        d="M20 165
           C 35 158, 45 158, 55 165
           C 65 172, 75 172, 85 165
           C 95 155, 108 150, 120 165
           C 132 180, 145 175, 155 155
           C 165 135, 178 135, 190 165
           C 202 195, 215 190, 228 145
           C 241 100, 255 100, 268 165
           C 281 230, 296 230, 310 120
           C 322 30, 336 30, 350 165
           C 362 275, 378 275, 392 90
           C 406 -30, 420 -30, 434 165
           C 444 300, 458 300, 470 20"
        stroke="#0d0d0d"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <p class="wordmark">Amplify</p>
  </div>
</body>
</html>

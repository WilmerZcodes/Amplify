<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&display=swap" />
<style>
  :root {
    --amplify-red: #fb2623;
    --amplify-white: #ffffff;
    --amplify-black: #0d0d0d;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background-color: var(--amplify-white);
  }

  header,
  footer {
    background-color: var(--amplify-red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-block: clamp(0.6rem, 2vh, 1.1rem);
    padding-inline: 16px;
  }

  .logo-link {
    display: block;
    line-height: 0;
    width: min(50vw, 210px);
    aspect-ratio: 612 / 280;
    overflow: hidden;
  }

  .logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .nav-link {
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(0.75rem, 1.6vw, 0.95rem);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--amplify-black);
    border-bottom: 0.08em solid var(--amplify-black);
    white-space: nowrap;
    padding-bottom: 0.1em;
  }

  .nav-link:hover {
    opacity: 0.7;
  }

  main {
    padding: clamp(2rem, 6vh, 4rem) clamp(1.5rem, 6vw, 4rem);
  }

  .headline {
    margin: 0;
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(0.85rem, 2.3vw, 1.85rem);
    line-height: 1.3;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--amplify-black);
    white-space: nowrap;
  }

  .mobile-break {
    display: none;
  }

  @media (max-width: 640px) {
    .headline {
      white-space: normal;
      font-size: clamp(0.9rem, 4.6vw, 1.3rem);
    }

    .mobile-break {
      display: inline;
    }

    .section-title {
      font-size: clamp(1.05rem, 5.2vw, 1.5rem);
    }
  }

  .headline u {
    font-weight: 900;
    text-decoration-color: var(--amplify-black);
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.2em;
  }

  .section-title {
    margin: clamp(3rem, 8vh, 5rem) 0 0;
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(0.85rem, 2.3vw, 1.85rem);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--amplify-black);
  }
</style>
</head>
<body>
  <header>
    <a class="logo-link" href="index.html"><img class="logo" src="bild__1_-removebg-preview.png" alt="Amplify" /></a>
    <a class="nav-link" href="vi-pa-amplify.html">Vi på Amplify</a>
  </header>
  <main>
    <h1 class="headline">Bli hörd på marknaden<br class="mobile-break" /> - <u>amplifiera din marknadsvolym</u></h1>
    <h2 class="section-title">Vad vi gör för ditt företag</h2>
    <h2 class="section-title">Våra tjänster</h2>
    <h2 class="section-title">Ett företag innan och efter amplify</h2>
    <h2 class="section-title">Intresserad? Kontakta oss.</h2>
  </main>
  <footer></footer>
</body>
</html>

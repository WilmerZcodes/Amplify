<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<style>
  :root {
    --amplify-red: #fb2623;
    --amplify-white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background-color: var(--amplify-white);
  }

  header {
    background-color: var(--amplify-red);
    display: flex;
    justify-content: center;
    padding-block: clamp(1.25rem, 4vh, 2.5rem);
    padding-inline: 16px;
  }

  .logo {
    width: min(60vw, 260px);
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <header>
    <img class="logo" src="bild.png" alt="Amplify" />
  </header>
</body>
</html>

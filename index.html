<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<style>
  :root {
    --amplify-red: #fb2623;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background-color: var(--amplify-red);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: clamp(2rem, 6vh, 5rem);
  }

  .logo {
    width: min(90vw, 480px);
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <img class="logo" src="bild.png" alt="Amplify" />
</body>
</html>

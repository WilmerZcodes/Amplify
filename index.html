<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" />
<style>
  :root {
    --amplify-red: #fb2623;
    --amplify-white: #ffffff;
    --amplify-black: #0d0d0d;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background-color: var(--amplify-white);
  }

  header {
    background-color: var(--amplify-red);
    display: flex;
    justify-content: flex-start;
    padding-block: clamp(1.25rem, 4vh, 2.5rem);
    padding-inline: 16px;
  }

  .logo {
    width: min(60vw, 260px);
    height: auto;
    display: block;
  }

  main {
    padding: clamp(2rem, 6vh, 4rem) clamp(1.5rem, 6vw, 4rem);
  }

  .headline {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: clamp(0.85rem, 2.3vw, 1.85rem);
    line-height: 1.3;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--amplify-black);
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    .headline {
      white-space: normal;
      font-size: clamp(1.05rem, 5.2vw, 1.5rem);
      text-wrap: balance;
    }
  }

  .headline u {
    font-weight: 800;
    text-decoration-color: var(--amplify-black);
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.2em;
  }
</style>
</head>
<body>
  <header>
    <img class="logo" src="bild.png" alt="Amplify" />
  </header>
  <main>
    <h1 class="headline">Bli hörd på marknaden - <u>amplifiera din marknadsvolym</u></h1>
  </main>
</body>
</html>

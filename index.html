<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<style>
  :root {
    --amplify-red: #fb2623;
    --amplify-white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background-color: var(--amplify-white);
  }

  header {
    background-color: var(--amplify-red);
    display: flex;
    justify-content: flex-start;
    padding-block: clamp(1.25rem, 4vh, 2.5rem);
    padding-inline: 16px;
  }

  .logo {
    width: min(60vw, 260px);
    height: auto;
    display: block;
  }

  main {
    padding: clamp(2rem, 6vh, 4rem) clamp(1.5rem, 6vw, 4rem);
  }

  .headline {
    margin: 0;
    max-width: 20ch;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(1.75rem, 5vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: #0d0d0d;
    text-wrap: balance;
  }

  .headline u {
    text-decoration-color: var(--amplify-red);
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.12em;
  }
</style>
</head>
<body>
  <header>
    <img class="logo" src="bild.png" alt="Amplify" />
  </header>
  <main>
    <h1 class="headline">Bli hörd på marknaden - <u>amplifiera din marknadsvolym</u></h1>
  </main>
</body>
</html>
